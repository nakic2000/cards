<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10271e">
  <title>Random Four Cards</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right))
        max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      background: radial-gradient(ellipse at top, #27503f, #10271e 75%);
      color: #f7f4e8;
      font: 1rem system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 46rem;
      display: grid;
      justify-items: center;
      gap: clamp(0.75rem, 3vh, 1.5rem);
    }

    h1 {
      margin: 0;
      text-align: center;
      font: 700 clamp(1.65rem, 5vw, 3rem) Georgia, serif;
    }

    .deck-picker {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    select, button {
      min-height: 48px;
      padding: 0.5rem 0.75rem;
      border: 1px solid #d9c897;
      border-radius: 0.65rem;
      background: #f7f4e8;
      color: #17291f;
      font: 600 1rem system-ui, sans-serif;
      touch-action: manipulation;
    }

    select { max-width: 100%; }

    #hand {
      width: 100%;
      max-width: 20rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(0.5rem, 2vw, 1rem);
    }

    @media (min-width: 600px), (orientation: landscape) {
      #hand {
        max-width: min(100%, 122vh);
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    .card-slot {
      position: relative;
      aspect-ratio: 167.087 / 242.667;
      overflow: hidden;
      border-radius: 5%;
      box-shadow: 0 6px 16px #0006;
    }

    .card-slot img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: white;
    }

    .actions {
      width: 100%;
      max-width: 24rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    button { cursor: pointer; }

    #stop-card { background: #efce73; }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    select:focus-visible, button:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Random Four Cards</h1>
    <div class="deck-picker">
      <label for="deck">Deck</label>
      <select id="deck">
        <option value="52">52 cards (full deck)</option>
        <option value="32">32 cards (7–10, J, Q, K, A)</option>
        <option value="20">20 cards (10, J, Q, K, A)</option>
      </select>
    </div>
    <div id="hand" aria-label="Four-card hand" role="group"></div>
    <div class="actions">
      <button id="stop-card" type="button">Stop Card</button>
      <button id="deal" type="button">Deal again</button>
    </div>
  </main>
  <script src="random4.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Four Cards</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #244b3b, #091b14 80%);
      color: #f7f4e8;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(44rem, calc(100% - 2rem));
      padding: 2rem 0;
      text-align: center;
    }

    h1 {
      margin: 0 0 2rem;
      font: 700 clamp(2rem, 5vw, 3.5rem) Georgia, serif;
    }

    .deck-picker {
      margin-bottom: 1.5rem;
    }

    select {
      margin-left: 0.5rem;
      padding: 0.4rem;
      border-radius: 0.35rem;
      font: inherit;
    }

    #hand {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(0.5rem, 2vw, 1.25rem);
      margin-bottom: 2rem;
    }

    #hand img {
      display: block;
      width: 100%;
      aspect-ratio: 167.087 / 242.667;
      border-radius: 5%;
      background: white;
      box-shadow: 0 8px 20px #0006;
    }

    .card-slot {
      position: relative;
      overflow: hidden;
      border-radius: 5%;
      box-shadow: 0 8px 20px #0006;
    }

    #hand .card-slot img {
      box-shadow: none;
    }

    .card-slot .outgoing-card {
      position: absolute;
      inset: 0;
    }

    button {
      padding: 0.75rem 1.25rem;
      border: 0;
      border-radius: 0.5rem;
      background: #efce73;
      color: #18281e;
      font: 700 1rem system-ui, sans-serif;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #ffe097;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    button:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Random Four Cards</h1>
    <div class="deck-picker">
      <label for="deck">Deck</label>
      <select id="deck">
        <option value="52">52 cards (full deck)</option>
        <option value="32">32 cards (7–10, J, Q, K, A)</option>
        <option value="20">20 cards (10, J, Q, K, A)</option>
      </select>
    </div>
    <div id="hand" aria-live="polite" aria-atomic="true"></div>
    <button id="stop-card" type="button">Stop Card</button>
    <button id="deal" type="button">Deal again</button>
  </main>

  <script src="random4.js"></script>
</body>
</html>
